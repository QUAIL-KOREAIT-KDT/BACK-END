services:
  web:
    build:
      context: ../WEB-FRONT-END
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_WEB_BASE_URL: ${NEXT_PUBLIC_WEB_BASE_URL:-https://pangpangpangs.com}
        NEXT_PUBLIC_KAKAO_LOGIN_FLOW: ${NEXT_PUBLIC_KAKAO_LOGIN_FLOW:-redirect}
        NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${NEXT_PUBLIC_KAKAO_REDIRECT_URI:-https://pangpangpangs.com/auth/kakao/callback}
        NEXT_PUBLIC_KAKAO_JS_KEY: ${NEXT_PUBLIC_KAKAO_JS_KEY:-}
        PANGPANG_BACKEND_ORIGIN: ${PANGPANG_BACKEND_ORIGIN:-http://api:8000}
