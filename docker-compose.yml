services:
  db:
    image: mysql:8.0
    container_name: pangpang-mysql
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "quail_db"
    ports:
      - "3307:3306"
    volumes:
      - pangpang_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p1234 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pangpang-api:dev
    container_name: pangpang-api
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - .env.compose
    volumes:
      # Keep secrets outside the Docker image. The env value
      # FIREBASE_CREDENTIALS_PATH should point to /app/firebase-admin-key.json.
      - ./firebase-admin-key.json:/app/firebase-admin-key.json:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${PANGPANG_WEB_IMAGE:-pangpang-web:local}
    container_name: pangpang-web
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_WEB_BASE_URL: ${NEXT_PUBLIC_WEB_BASE_URL:-https://pangpangpangs.com}
      NEXT_PUBLIC_KAKAO_JS_KEY: ${NEXT_PUBLIC_KAKAO_JS_KEY:-27933cda9860739d03f4eb0a5263e68c}
      NEXT_PUBLIC_KAKAO_LOGIN_FLOW: ${NEXT_PUBLIC_KAKAO_LOGIN_FLOW:-redirect}
      NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${NEXT_PUBLIC_KAKAO_REDIRECT_URI:-https://pangpangpangs.com/auth/kakao/callback}
      PANGPANG_BACKEND_ORIGIN: ${PANGPANG_BACKEND_ORIGIN:-http://api:8000}
    expose:
      - "3000"
    depends_on:
      - api
   
  nginx:
    image: nginx:alpine
    container_name: pangpang-nginx
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot

volumes:
  pangpang_mysql_data:
