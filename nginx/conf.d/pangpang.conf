upstream api_upstream {
    server api:8000;
}

upstream web_upstream {
    server web:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP is only used for ACME challenges and lightweight container health checks.
# All real traffic is redirected to HTTPS.
server {
    listen 80;
    server_name pangpangpangs.com www.pangpangpangs.com;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pangpangpangs.com www.pangpangpangs.com;

    ssl_certificate     /etc/letsencrypt/live/pangpangpangs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pangpangpangs.com/privkey.pem;

    client_max_body_size 30m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Released mobile app and web BFF/API contracts must stay on FastAPI.
    location = /api {
        proxy_pass http://api_upstream;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /api/ {
        proxy_pass http://api_upstream;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Optional backend liveness endpoint after / is served by Next.js.
    location = /backend-health {
        proxy_pass http://api_upstream/;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Web service. Keep this after /api so mobile traffic cannot be captured by Next.js.
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
